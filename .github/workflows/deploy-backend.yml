name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Generate requirements.txt
        working-directory: backend
        run: uv pip compile pyproject.toml -o requirements.txt

      - name: Zip backend
        run: |
          cd backend
          zip -r ../backend.zip . \
            -x ".venv/*" \
            -x "__pycache__/*" \
            -x "*.pyc" \
            -x "uv.lock" \
            -x "tests/*"

      - name: Deploy via Kudu zip deploy
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_BACKEND_PUBLISH_PROFILE }}
        run: |
          # Extract SCM credentials and URL from publish profile XML
          python3 -c "
          import os, xml.etree.ElementTree as ET
          root = ET.fromstring(os.environ['PUBLISH_PROFILE'])
          p = root.find('.//publishProfile[@publishMethod=\"MSDeploy\"]')
          host = p.get('publishUrl').replace(':443', '')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'SCM_HOST={host}\n')
              f.write(f'KUDU_CREDS={p.get(\"userName\")}:{p.get(\"userPWD\")}\n')
          "
      - name: Push to Kudu
        run: |
          curl -sf -X POST \
            "https://${SCM_HOST}/api/zipdeploy" \
            -u "${KUDU_CREDS}" \
            --data-binary @backend.zip \
            -H "Content-Type: application/zip"

      # ── Integration tests ────────────────────────────────────────────────────
      # Requires AZURE_CREDENTIALS secret (service principal JSON).
      # Create with: az ad sp create-for-rbac --name embedmatch-github --role contributor
      #              --scopes /subscriptions/<id>/resourceGroups/EmbedMatch --json-auth
      # If absent, the IP whitelist steps are skipped and tests run against
      # whatever access restrictions are currently in place.

      - name: Get runner IP
        id: runner_ip
        run: echo "ip=$(curl -sf https://api.ipify.org)" >> $GITHUB_OUTPUT

      - name: Azure login
        if: env.HAS_AZURE_CREDENTIALS == 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Whitelist runner IP on App Service
        if: env.HAS_AZURE_CREDENTIALS == 'true'
        run: |
          az webapp config access-restriction add \
            --resource-group EmbedMatch \
            --name embed-match-web \
            --action Allow \
            --ip-address ${{ steps.runner_ip.outputs.ip }}/32 \
            --priority 200 \
            --rule-name github-runner

      - name: Run integration tests
        working-directory: backend
        continue-on-error: true
        env:
          INTEGRATION_BASE_URL: https://embed-match-web-hfasa8feb5bxf3hw.switzerlandnorth-01.azurewebsites.net
        run: uv run pytest -m integration tests/test_integration.py -v

      - name: Remove runner IP restriction
        if: always() && env.HAS_AZURE_CREDENTIALS == 'true'
        run: |
          az webapp config access-restriction remove \
            --resource-group EmbedMatch \
            --name embed-match-web \
            --rule-name github-runner
